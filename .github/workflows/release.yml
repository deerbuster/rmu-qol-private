name: Release Foundry Module

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate module version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(jq -r '.version' module.json)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "module.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build module zip
        run: |
          mkdir -p dist
          zip -r "dist/rmu-qol.zip" \
            module.json README.md CHANGELOG.md scripts styles packs \
            -x "*.git*" ".github/*" "dist/*"
          cp module.json dist/module.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/rmu-qol.zip
          generate_release_notes: true
